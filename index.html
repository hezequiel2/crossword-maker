<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crossword Maker for Teachers</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><rect width='12' height='12' fill='%23f6efe1'/><g fill='none' stroke='%231d4570' stroke-width='0.6'><rect x='1' y='1' width='10' height='10'/><line x1='1' y1='4.33' x2='11' y2='4.33'/><line x1='1' y1='7.66' x2='11' y2='7.66'/><line x1='4.33' y1='1' x2='4.33' y2='11'/><line x1='7.66' y1='1' x2='7.66' y2='11'/></g><rect x='4.33' y='4.33' width='3.33' height='3.33' fill='%231d4570'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=DM+Sans:wght@400..600&display=swap">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="screen-only">
    <div id="auth-strip" class="auth-strip">
      <span id="auth-status" class="auth-status">Not signed in</span>
      <div class="auth-actions">
        <button id="signin-btn" type="button">Sign in</button>
        <button id="signout-btn" type="button" hidden>Sign out</button>
      </div>
    </div>
    <div class="masthead">
      <span class="wordmark-glyph" aria-hidden="true">
        <svg viewBox="0 0 12 12" width="28" height="28">
          <g fill="none" stroke="currentColor" stroke-width="0.6">
            <rect x="1" y="1" width="10" height="10"/>
            <line x1="1" y1="4.33" x2="11" y2="4.33"/>
            <line x1="1" y1="7.66" x2="11" y2="7.66"/>
            <line x1="4.33" y1="1" x2="4.33" y2="11"/>
            <line x1="7.66" y1="1" x2="7.66" y2="11"/>
          </g>
          <rect x="4.33" y="4.33" width="3.33" height="3.33" fill="currentColor"/>
        </svg>
      </span>
      <h1>Crossword Maker</h1>
    </div>
    <p class="tagline">Crosswords for elementary classrooms!</p>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main>
    <section class="form screen-only">
      <div id="editing-pill" class="editing-pill" hidden>
        <span class="editing-pill__dot" aria-hidden="true"></span>
        <span class="editing-pill__label">Editing:</span>
        <span class="editing-pill__name"></span>
        <button type="button" class="editing-pill__clear" aria-label="Start new puzzle">
          <span aria-hidden="true">×</span> Start new
        </button>
      </div>

      <label class="field">
        <span>Puzzle title</span>
        <input id="title" type="text" placeholder="Spring Vocabulary" />
      </label>

      <label class="field">
        <span>Words and clues (one per line: <code>answer, clue</code> — separator can be a comma, <code>=</code>, or <code>:</code>)</span>
        <textarea id="entries" rows="12" spellcheck="false" placeholder="SUN, It rises in the east each morning&#10;RAIN, Water that falls from clouds&#10;..."></textarea>
      </label>

      <label class="field inline">
        <span>Clues placement (print)</span>
        <select id="answer-placement">
          <option value="below" selected>Below puzzle</option>
          <option value="side">Side column</option>
          <option value="separate">Separate page</option>
        </select>
      </label>

      <div class="actions">
        <button id="generate" type="button" class="primary">Generate puzzle</button>
        <button id="regenerate" type="button" disabled>Try another layout</button>
        <span class="actions-divider" aria-hidden="true"></span>
        <button id="print-puzzle" type="button" disabled>Print puzzle</button>
        <button id="print-answers" type="button" disabled>Print answer key</button>
        <span class="actions-divider" aria-hidden="true"></span>
        <button id="save-puzzle" type="button" disabled title="Sign in to save">Save</button>
        <button id="my-puzzles" type="button" class="outline-primary" disabled title="Sign in to view your puzzles">My puzzles</button>
      </div>

      <div id="warning" class="warning" hidden></div>
    </section>

    <section id="output" class="output" aria-live="polite"></section>
  </main>

  <footer class="screen-only app-version">v1.7.1</footer>

  <!-- Auth modal -->
  <dialog id="auth-modal" class="modal">
    <form method="dialog" class="modal-body" id="auth-form">
      <div class="modal-header">
        <div class="tabs">
          <button type="button" id="tab-signin" class="tab active">Sign in</button>
          <button type="button" id="tab-signup" class="tab">Create account</button>
        </div>
        <button type="button" class="modal-close" data-close-auth aria-label="Close">×</button>
      </div>
      <label class="field">
        <span>Email</span>
        <input id="auth-email" type="email" autocomplete="email" placeholder="you@school.edu" required />
      </label>
      <label class="field">
        <span>Password</span>
        <div class="password-wrap">
          <input id="auth-password" type="password" autocomplete="current-password" minlength="6" required />
          <button type="button" class="password-toggle" data-toggle-target="auth-password" aria-label="Show password" aria-pressed="false">
            <span class="eye-icon" aria-hidden="true">👁</span>
          </button>
        </div>
      </label>
      <label class="field" id="auth-password-confirm-field" hidden>
        <span>Confirm password</span>
        <div class="password-wrap">
          <input id="auth-password-confirm" type="password" autocomplete="new-password" minlength="6" />
          <button type="button" class="password-toggle" data-toggle-target="auth-password-confirm" aria-label="Show password" aria-pressed="false">
            <span class="eye-icon" aria-hidden="true">👁</span>
          </button>
        </div>
      </label>
      <div id="auth-captcha" class="captcha" hidden></div>
      <div id="auth-error" class="warning" hidden></div>
      <div class="actions">
        <button id="auth-submit" type="submit" class="primary">Sign in</button>
        <button type="button" id="auth-forgot" class="linkish">Forgot password?</button>
      </div>
    </form>
    <div class="modal-body auth-check-email" id="auth-check-email" hidden>
      <div class="modal-header">
        <h2 class="modal-title">Check your email</h2>
        <button type="button" class="modal-close" data-close-auth aria-label="Close">×</button>
      </div>
      <p>We sent a confirmation link to <strong id="auth-check-email-address"></strong>. Click it to finish creating your account. The link expires in 24 hours.</p>
      <p class="muted">Didn't get it? Check spam, or resend below.</p>
      <div id="auth-check-email-status" class="auth-check-status" hidden></div>
      <div class="actions">
        <button type="button" id="auth-resend" class="primary">Resend email</button>
        <button type="button" class="linkish" data-close-auth>Close</button>
      </div>
    </div>
  </dialog>

  <!-- My Puzzles modal -->
  <dialog id="puzzles-modal" class="modal">
    <div class="modal-body">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2>My puzzles</h2>
          <p id="puzzles-count" class="modal-subtitle muted"></p>
        </div>
        <button type="button" class="modal-close" data-close-puzzles aria-label="Close">×</button>
      </div>
      <div id="puzzles-list" class="puzzles-list">
        <p class="muted">Loading…</p>
      </div>
    </div>
  </dialog>

  <script>
    window.SUPABASE_URL = 'https://odeupftrdoldzdomjoeu.supabase.co';
    window.SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OT_vPShIzdKF_pjsPexglA_jcXP21Xa';
    // Turnstile site key (public). Secret key lives in SETUP.local.md and is
    // pasted into the Supabase CAPTCHA settings, not into the client.
    window.TURNSTILE_SITE_KEY = '0x4AAAAAADRjaP1UGPjBYlMG';
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
